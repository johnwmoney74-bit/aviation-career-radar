name: Build Windows application

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-windows-build
  cancel-in-progress: false

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Read source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test the application
        run: python -m unittest discover -s tests -v
      - name: Check Python and JavaScript
        run: |
          python -m compileall -q app.py window_app.py radar build_tools
          node --check radar/static/app.js
      - name: Build no-console Windows executable
        run: python -m PyInstaller --clean --noconfirm Radar.spec
      - name: Test the packaged executable
        run: python build_tools/smoke_executable.py dist/AviationCareerRadar/AviationCareerRadar.exe
      - name: Include instructions and build identity
        shell: pwsh
        run: |
          Copy-Item RUN-WINDOWS.txt dist/AviationCareerRadar/READ-ME-FIRST.txt
          Copy-Item START-HERE-GITHUB.md dist/AviationCareerRadar/BUILD-INSTRUCTIONS.md
          Copy-Item frozen-smoke-test.json dist/AviationCareerRadar/
          "Source commit: $env:GITHUB_SHA`nBuild run: $env:GITHUB_RUN_ID" | Set-Content dist/AviationCareerRadar/BUILD.txt
      - name: Downloadable Windows application
        uses: actions/upload-artifact@v7
        with:
          name: Aviation-Career-Radar-Windows
          path: dist/AviationCareerRadar/
          retention-days: 7
          if-no-files-found: error
      - name: Diagnostic build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Build-diagnostics
          path: |
            frozen-smoke-test.json
            build/**/warn-*.txt
          retention-days: 7
          if-no-files-found: ignore
